[versions]
agp = "8.6.1"
glide = "4.16.0"
kotlin = "1.9.0"
mapSecret = "2.0.1"
coreKtx = "1.16.0"
junit = "4.13.2"
junitVersion = "1.2.1"
espressoCore = "3.6.1"
appcompat = "1.7.0"
material = "1.12.0"
activity = "1.10.1"
googleMaps = "19.2.0"
constraintlayout = "2.2.1"
mockitoKotlin = "5.2.1"
retrofit = "2.11.0"
gson = "2.11.0"
okhttp = "4.12.0"
annotation = "1.9.1"
lifecycleLivedataKtx = "2.8.7"
lifecycleViewmodelKtx = "2.8.7"
compose-material3 = "1.3.2"
playServicesLocation = "21.3.0"
